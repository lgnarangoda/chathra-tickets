openapi: 3.0.3
info:
  title: Chathra API
  version: 1.1.0
  description: |
    OpenAPI definition for the Chathra NestJS service.
    Use this document to explore the available endpoints and their payloads.
servers:
  - url: http://localhost:3000/v1
    description: Local development server (v1)
paths:
  /v1:
    get:
      summary: Get service status
      description: Returns a simple text message to confirm the API is reachable.
      operationId: getRoot
      responses:
        '200':
          description: Successful response containing the greeting message.
          content:
            text/plain:
              schema:
                type: string
              example: Welcome to the Chathra API!
  /v1/user/register:
    post:
      summary: Register a new user
      description: Creates a user account using the provided username and password.
      operationId: registerUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            examples:
              default:
                value:
                  username: user@example.com
                  password: MySecureP@ssw0rd
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
              example:
                id: 1
                email: user@example.com
                name: user@example.com
        '400':
          description: Validation error or missing required fields.
  /v1/auth/login:
    post:
      summary: Authenticate and obtain an access token
      description: Authenticates the user using username and password credentials and returns a JWT access token.
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  username: user@example.com
                  password: MySecureP@ssw0rd
      responses:
        '200':
          description: Authentication successful. Returns a JWT access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials or user not authorized.
  /v1/auth/profile:
    get:
      summary: Get the current authenticated user's profile
      description: Returns the user claims extracted from the provided JWT access token.
      operationId: getProfile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved the authenticated user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                userId: 1
                email: user@example.com
                name: John Doe
        '401':
          description: Missing, invalid, or expired JWT access token.
  /v1/venues:
    post:
      summary: Create a venue
      description: Creates a venue record with the provided details.
      operationId: createVenue
      tags:
        - Venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueDto'
            examples:
              default:
                value:
                  name: Grand Hall
                  address: 123 Event Street
                  city: Colombo
                  country: Sri Lanka
                  zip: 00100
                  venueType: indoor
                  isParkingAvailable: true
                  status: ACTIVE
                  latitude: 6.9271
                  longitude: 79.8612
      responses:
        '201':
          description: Venue created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDto'
        '400':
          description: Validation error or missing required fields.
    get:
      summary: List venues
      description: Returns a paginated list of venues.
      operationId: listVenues
      tags:
        - Venue
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
        - in: query
          name: sort
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Paginated venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VenueDto'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                  nextPage:
                    type: integer
                    nullable: true
  /v1/events:
    post:
      summary: Create an event
      description: Creates an event.
      operationId: createEvent
      tags:
        - Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDto'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
    get:
      summary: List events
      description: Returns a paginated list of events.
      operationId: listEvents
      tags:
        - Event
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort
          schema:
            type: string
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventDto'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                  nextPage:
                    type: integer
                    nullable: true
  /v1/events/{eventId}:
    get:
      summary: Get event by id
      operationId: getEventById
      tags:
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '404':
          description: Not found
  /v1/events/{eventId}/status:
    patch:
      summary: Update event status
      operationId: updateEventStatus
      tags:
        - Event
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/EventStatus'
              required:
                - status
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
  /v1/events/{eventId}/ticket-categories:
    get:
      summary: List ticket categories by event
      operationId: listTicketCategoriesByEvent
      tags:
        - TicketCategory
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
        - in: query
          name: include
          schema:
            type: string
          description: Comma separated list of includes, e.g. tickets,subEvents
      responses:
        '200':
          description: Ticket categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketCategoryDto'
  /v1/events/{eventId}/tickets:
    get:
      summary: List tickets by event
      operationId: listTicketsByEvent
      tags:
        - Ticket
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDto'
  /v1/events/{eventId}/payments:
    get:
      summary: List payments by event
      operationId: listPaymentsByEvent
      tags:
        - Payment
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentDto'
  /v1/events/{eventId}/promotions:
    get:
      summary: List promotions by event
      operationId: listPromotionsByEvent
      tags:
        - Promotion
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionDto'
  /v1/events/{eventId}/refunds:
    get:
      summary: List refunds by event
      operationId: listRefundsByEvent
      tags:
        - Refund
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Refunds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundDto'
  /v1/events/{eventId}/sub-events:
    get:
      summary: List sub events by event
      operationId: listSubEventsByEvent
      tags:
        - SubEvent
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sub events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubEventDto'
  /v1/sub-events:
    post:
      summary: Create sub event
      operationId: createSubEvent
      tags:
        - SubEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubEventDto'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Sub event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubEventDto'
  /v1/sub-events/{subEventId}:
    get:
      summary: Get sub event by id
      operationId: getSubEventById
      tags:
        - SubEvent
      parameters:
        - in: path
          name: subEventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sub event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubEventDto'
        '404':
          description: Not found
  /v1/sub-events/{subEventId}/status:
    patch:
      summary: Update sub event status
      operationId: updateSubEventStatus
      tags:
        - SubEvent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subEventId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/SubEventStatus'
              required:
                - status
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubEventDto'
  /v1/organizers:
    post:
      summary: Create organizer
      operationId: createOrganizer
      tags:
        - Organizer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerDto'
      responses:
        '201':
          description: Organizer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerDto'
        '400':
          description: Validation error or missing required fields.
  /v1/organizers/by-event/{eventId}:
    get:
      summary: Get organizer by event id
      operationId: getOrganizerByEventId
      tags:
        - Organizer
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Organizer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerDto'
        '404':
          description: Organizer not found for the given event.
  /v1/payments:
    post:
      summary: Create payment
      operationId: createPayment
      tags:
        - Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDto'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDto'
  /v1/payments/by-event/{eventId}:
    get:
      summary: List payments by event
      operationId: listPaymentsByEventAlt
      tags:
        - Payment
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentDto'
  /v1/promotions:
    post:
      summary: Create promotion
      operationId: createPromotion
      tags:
        - Promotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionDto'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Promotion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionDto'
  /v1/promotions/by-event/{eventId}:
    get:
      summary: List promotions by event
      operationId: listPromotionsByEventAlt
      tags:
        - Promotion
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionDto'
  /v1/refunds:
    post:
      summary: Create refund
      operationId: createRefund
      tags:
        - Refund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundDto'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundDto'
  /v1/refunds/by-event/{eventId}:
    get:
      summary: List refunds by event
      operationId: listRefundsByEventAlt
      tags:
        - Refund
        - Event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Refunds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundDto'
  /v1/ticket-categories:
    post:
      summary: Create ticket categories
      description: Creates one or more ticket categories for an event.
      operationId: createTicketCategories
      tags:
        - TicketCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TicketCategoryCreateRequest'
            examples:
              default:
                value:
                  - eventId: 1
                    name: VIP Tickets
                    description: Premium seating with exclusive access
                    basePrice: 150.00
                    maxQuantity: 10
                    minQuantity: 1
                    status: ACTIVE
                    seatMap: section-a-vip
                  - eventId: 1
                    name: General Admission
                    description: Standard entry tickets
                    basePrice: 50.00
                    maxQuantity: 5
                    minQuantity: 1
                    status: ACTIVE
      responses:
        '201':
          description: Ticket categories created successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketCategoryDto'
        '400':
          description: Validation error or missing required fields.
  /v1/ticket-categories/{ticketCategoryId}/tickets:
    get:
      summary: List tickets by ticket category
      operationId: listTicketsByTicketCategory
      tags:
        - Ticket
        - TicketCategory
      parameters:
        - in: path
          name: ticketCategoryId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDto'
  /v1/ticket-categories/{ticketCategoryId}/sub-events:
    get:
      summary: List sub events links by ticket category
      operationId: listSubEventsByTicketCategory
      tags:
        - SubEvent
        - TicketCategory
      parameters:
        - in: path
          name: ticketCategoryId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ticket sub events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSubEventDto'
  /v1/bookings/{bookingId}:
    get:
      summary: Get booking with tickets and ticketCategory
      operationId: getBookingExpanded
      tags:
        - Booking
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking expanded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRegistrationRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          format: email
          description: Email address that will be used as both username and display name.
          example: user@example.com
        password:
          type: string
          format: password
          description: Plain-text password that will be hashed before storage.
          minLength: 8
          example: MySecureP@ssw0rd
    UserRegistrationResponse:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Auto generated identifier of the new user.
        email:
          type: string
          format: email
          description: Email address associated with the user.
        name:
          type: string
          description: Display name of the user.
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          format: email
          description: Email address used during registration.
        password:
          type: string
          format: password
          description: Plain-text password for authentication.
    LoginResponse:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: JWT access token to be used for authenticated requests.
    UserProfile:
      type: object
      description: User details resolved from the validated JWT payload.
      required:
        - userId
        - email
        - name
      properties:
        userId:
          type: integer
          format: int64
          description: Unique identifier of the authenticated user.
        email:
          type: string
          format: email
          description: Email address associated with the token.
        name:
          type: string
          description: Display name of the authenticated user.
    ApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
    ChangeRequestApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
    BookingStatus:
      type: string
      enum:
        - confirmed
        - cancelled
        - refunded
    BookingPaymentStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    PaymentStatus:
      type: string
      enum:
        - success
        - failed
        - pending
    EntityType:
      type: string
      enum:
        - event
        - sub_event
    EventMode:
      type: string
      enum:
        - online
        - offline
        - hybrid
    EventCategory:
      type: string
      enum:
        - concert
        - conference
        - workshop
        - seminar
        - festival
        - sports
        - theater
        - other
    EventApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
    EventStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    OrganizerStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    PromotionStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    RefundStatus:
      type: string
      enum:
        - initiated
        - completed
        - failed
    ResourcePersonStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    SubEventApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
    SubEventStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    TicketCategoryStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - SOLD_OUT
    TicketStatus:
      type: string
      enum:
        - valid
        - used
        - cancelled
        - refunded
    TicketSubEventStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    UserStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    VenueStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
        - archived
    BaseDto:
      type: object
      properties:
        createdBy:
          type: string
          description: Identifier of the user who created the record.
          nullable: true
        createdOn:
          type: string
          format: date-time
          description: Timestamp when the record was created.
        updatedOn:
          type: string
          format: date-time
          description: Timestamp when the record was last updated.
        updatedBy:
          type: string
          description: Identifier of the user who last updated the record.
          nullable: true
    ApprovalDto:
      allOf:
        - $ref: '#/components/schemas/BaseDto'
        - type: object
          required:
            - approvalId
            - approvalStatus
          properties:
            approvalId:
              type: integer
              format: int64
            changeRequestId:
              type: integer
              format: int64
              nullable: true
            approverId:
              type: integer
              format: int64
              nullable: true
            approvedAt:
              type: string
              format: date-time
              nullable: true
            approvalStatus:
              $ref: '#/components/schemas/ApprovalStatus'
            approvalNotes:
              type: string
              nullable: true
            changeRequest:
              $ref: '#/components/schemas/ChangeRequestDto'
              nullable: true
            approver:
              $ref: '#/components/schemas/UserDto'
              nullable: true
    BookingDto:
      allOf:
        - $ref: '#/components/schemas/BaseDto'
        - type: object
          required:
            - bookingId
            - userId
            - eventId
            - status
            - isTest
            - paymentStatus
          properties:
            bookingId:
              type: integer
              format: int64
            userId:
              type: integer
              format: int64
            eventId:
              type: integer
              format: int64
            status:
              $ref: '#/components/schemas/BookingStatus'
            isTest:
              type: boolean
            referrer:
              type: string
              nullable: true
            totalAmount:
              type: number
              format: double
              nullable: true
            paymentStatus:
              $ref: '#/components/schemas/BookingPaymentStatus'
            user:
              $ref: '#/components/schemas/UserDto'
              nullable: true
            event:
              $ref: '#/components/schemas/EventDto'
              nullable: true
            tickets:
              type: array
              items:
                $ref: '#/components/schemas/TicketDto'
              nullable: true
            payments:
              type: array
              items:
                $ref: '#/components/schemas/PaymentDto'
              nullable: true
    ChangeRequestDto:
      allOf:
        - $ref: '#/components/schemas/BaseDto'
        - type: object
          required:
            - changeRequestId
            - approvalStatus
          properties:
            changeRequestId:
              type: integer
              format: int64
            entityType:
              $ref: '#/components/schemas/EntityType'
              nullable: true
            originalEntityId:
              type: integer
              format: int64
              nullable: true
